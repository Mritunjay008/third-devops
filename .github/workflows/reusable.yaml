name: Reusable deploy
on: 
  workflow_call:
    inputs:
      artifact-name: 
        description: The name of the deployable artifact files
        required: true
        default: dist-files
        type: string
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/download-artifact@v5
        with:
          name: ${{ inputs.artifact-name }}
      - name: List files
        run: ls
      - name: Output Information
        run: echo "deplying..."