name: Lint test and deploy on push
on: push
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: code checkout
        uses: actions/checkout@v7
      - name: install Dependencies
        run: npm install
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
      - name: Lint testing
        run: npm run lint
      - name: test case
        run: npm run test
      - name: build
        run: npm run build

